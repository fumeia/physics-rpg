<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Physics RPG</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #070a12; color: #e8eefc; font: 16px/1.5 system-ui, sans-serif; }
  .box { text-align: center; max-width: 560px; padding: 20px; } img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 14px 0 6px; } #msg { color: #b9c4dc; min-height: 48px; } .err { color: #ff9b9b !important; }
  .bar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; margin: 14px auto; width: 320px; } .bar i { display: block; height: 100%; width: 3%; background: linear-gradient(90deg, #6cb6ff, #8de0ff); transition: width .2s; }
  button { background: #6cb6ff; color: #08101e; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; display: none; margin: 0 auto; }
</style></head><body><div class="box">
<img src="icon.png" alt=""><h1>Physics RPG</h1>
<div class="bar"><i id="fill"></i></div><div id="msg">Getting the game from your server (first start only)…</div><button id="retry">Try again now</button>
<script>
  const $ = (i) => document.getElementById(i);
  const show = (s) => { $('msg').textContent = s.msg || $('msg').textContent; $('msg').className = s.err ? 'err' : ''; $('retry').style.display = s.err ? 'block' : 'none';
    const m = /(\d+) \/ (\d+)/.exec(s.msg || ''); if (m && +m[2]) $('fill').style.width = Math.max(3, 100 * m[1] / m[2]) + '%'; };
  window.rpgDesktop.onStatus(show); window.rpgDesktop.status().then((s) => s.msg && show(s));
  $('retry').onclick = () => { $('retry').style.display = 'none'; $('msg').textContent = 'Trying again…'; window.rpgDesktop.retry(); };
</script></div></body></html>
